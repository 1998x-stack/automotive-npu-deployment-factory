[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-npu-deployment-factory"
version = "0.1.0"
description = "Reproducible CNN export, quantization and QNN deployment experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
model = ["torch>=2.3", "torchvision>=0.18", "onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.6"]
viz = ["matplotlib>=3.8"]
fp16 = ["onnxconverter-common>=1.16"]
all = ["torch>=2.3", "torchvision>=0.18", "onnx>=1.16", "onnxruntime>=1.18", "pytest>=8", "ruff>=0.6"]

[project.scripts]
npu-factory = "npu_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
